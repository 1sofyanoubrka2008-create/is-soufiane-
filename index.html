<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofyan Interactive - مرحبا بك</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #333; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 400px; }
        h1 { color: #2d3436; font-size: 24px; margin-bottom: 10px; }
        p { color: #636e72; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 2px solid #dfe6e9; border-radius: 10px; outline: none; transition: border-color 0.3s; box-sizing: border-box; font-size: 16px; }
        input:focus { border-color: #0984e3; }
        button { background-color: #0984e3; color: white; border: none; padding: 12px 25px; border-radius: 10px; margin-top: 20px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:hover { background-color: #74b9ff; }
        #response { margin-top: 20px; font-weight: bold; color: #00b894; height: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sofyane AI 🤖</h1>
        <p>مرحبا بيك فالموقع ديالي التفاعلي الأول</p>
        <p style="font-size: 14px;">"كتبوا أي كلمة هنا وشوفوا شنو غايوقع"</p>
        <input type="text" id="userInput" placeholder="اكتب أي كلمة...">
        <button onclick="checkWord()">إرسال</button>
        <div id="response"></div>
    </div>

    <script>
        function checkWord() {
            const input = document.getElementById('userInput').value;
            const responseDiv = document.getElementById('response');
            
            if(input.trim() === "") {
                responseDiv.innerText = "عافاك كتب شي حاجة! 😊";
                responseDiv.style.color = "#d63031";
            } else {
                responseDiv.innerText = "سفيان كيقول ليك: " + input + " وصلات بنجاح! ✅";
                responseDiv.style.color = "#00b894";
                alert("شكراً حيت جربتي الموقع ديالي! 🚀");
            }
        }
    </script>
</body>
</html>
